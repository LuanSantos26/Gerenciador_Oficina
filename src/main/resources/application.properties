server.port=8080

# ===== Banco de dados: PostgreSQL =====
# Crie o banco uma vez antes de rodar (pgAdmin ou psql):  CREATE DATABASE oficina;
# URL, usuario e senha podem ser trocados por variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:7133642012}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'

# ===== JPA / Hibernate =====
# Cria e atualiza as tabelas automaticamente e mostra o SQL no terminal
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Fotos das OS (gravadas em disco nesta pasta) =====
oficina.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
